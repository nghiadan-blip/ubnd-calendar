<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MÀN HÌNH TV SẢNH - UBND XÃ NGHĨA LÂM</title>
  <!-- Google Fonts: Be Vietnam Pro -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #F4F7FB;
      color: #0B1F3A;
      font-family: 'Be Vietnam Pro', system-ui, -apple-system, sans-serif;
    }

    #tv-mode-container {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      padding: 24px 36px;
      box-sizing: border-box;
      overflow: hidden;
      position: relative;
    }

    .tv-header {
      height: 9vh;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid rgba(11, 31, 58, 0.08);
      padding-bottom: 12px;
    }

    .tv-brand h2 {
      font-size: clamp(26px, 2.3vw, 34px);
      font-weight: 800;
      color: #0B1F3A;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .tv-subbrand {
      font-size: clamp(15px, 1.1vw, 18px);
      font-weight: 700;
      color: #475569;
      letter-spacing: 1px;
    }

    .tv-clock-area {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    #tv-date {
      font-size: clamp(18px, 1.3vw, 22px);
      font-weight: 700;
      color: #475569;
      text-transform: uppercase;
    }

    #tv-time {
      font-size: clamp(50px, 4vw, 64px);
      font-weight: 900;
      color: #0B1F3A;
      font-feature-settings: "tnum";
    }

    .tv-body-lr {
      height: 79vh;
      display: flex;
      gap: 28px;
      margin: 20px 0;
      overflow: hidden;
    }

    .tv-left-today {
      flex: 7;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .tv-right-upcoming {
      flex: 3;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow: hidden;
    }

    .tv-section-title {
      font-size: clamp(22px, 1.6vw, 28px);
      font-weight: 800;
      color: #0B1F3A;
      margin-bottom: 24px;
      text-transform: uppercase;
      border-left: 6px solid #0B1F3A;
      padding-left: 12px;
    }

    .tv-section-title-small {
      font-size: clamp(16px, 1.2vw, 20px);
      font-weight: 800;
      color: #0B1F3A;
      margin-bottom: 12px;
      text-transform: uppercase;
      border-left: 4px solid #0B1F3A;
      padding-left: 8px;
    }

    .tv-today-timeline {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow: hidden;
    }

    .tv-timeline-item {
      display: flex;
      align-items: center;
      padding: 16px 24px;
      background: #FFFFFF;
      border-radius: 16px;
      border: 1px solid rgba(0, 0, 0, 0.04);
      box-shadow: 0 4px 12px rgba(11, 31, 58, 0.02);
      min-height: 85px;
      position: relative;
    }

    .tv-timeline-item.completed { opacity: 0.5; }

    .tv-timeline-item.ongoing {
      background: rgba(15, 118, 110, 0.04);
      border: 1px solid rgba(15, 118, 110, 0.15);
      box-shadow: 0 6px 18px rgba(15, 118, 110, 0.06);
    }

    .tv-timeline-item.ongoing::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 6px;
      background: #0F766E;
      border-top-left-radius: 16px;
      border-bottom-left-radius: 16px;
    }

    .tv-item-time {
      flex: 0 0 110px;
      font-size: clamp(24px, 1.8vw, 28px);
      font-weight: 800;
      color: #0B1F3A;
    }

    .tv-timeline-item.ongoing .tv-item-time { color: #0F766E; }

    .tv-item-body {
      flex: 1;
      padding-left: 20px;
      min-width: 0;
    }

    .tv-item-title {
      font-size: clamp(20px, 1.6vw, 24px);
      font-weight: 700;
      color: #0B1F3A;
      margin-bottom: 6px;
      line-height: 1.35;
    }

    .tv-timeline-item.ongoing .tv-item-title {
      color: #0F766E;
      font-weight: 800;
    }

    .tv-item-desc {
      font-size: clamp(15px, 1.1vw, 18px);
      color: #64748B;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }

    .tv-item-meta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .tv-item-meta strong { color: #334155; }

    .tv-item-status {
      flex: 0 0 180px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 16px;
    }

    .tv-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: clamp(13px, 0.9vw, 16px);
      font-weight: 800;
      padding: 6px 12px;
      border-radius: 8px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .tv-badge.completed { color: #475569; background: #F1F5F9; }
    .tv-badge.ongoing {
      color: #0F766E;
      background: rgba(15, 118, 110, 0.1);
      animation: pulse-teal 2s infinite ease-in-out;
    }
    @keyframes pulse-teal { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    .tv-badge.upcoming-near { color: #B45309; background: rgba(180, 83, 9, 0.1); }

    .tv-item-qr-small {
      width: 52px; height: 52px;
      background: white; border: 1px solid #E2E8F0;
      padding: 3px; border-radius: 6px; flex-shrink: 0;
    }
    .tv-item-qr-small img { width: 100%; height: 100%; }

    .tv-next-hero-card {
      background: #FFFFFF;
      border: 1px solid rgba(0, 0, 0, 0.04);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(11, 31, 58, 0.03);
      display: flex;
      flex-direction: column;
      flex: 1.2;
      min-height: 250px;
      justify-content: center;
    }

    .tv-hero-label {
      font-size: clamp(15px, 1.1vw, 18px);
      font-weight: 800;
      color: #475569;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 12px;
    }

    .tv-hero-time {
      font-size: clamp(44px, 3.5vw, 56px);
      font-weight: 900;
      color: #0B1F3A;
      text-align: center;
      margin-bottom: 16px;
    }

    .tv-hero-title {
      font-size: clamp(22px, 1.7vw, 26px);
      font-weight: 800;
      color: #0B1F3A;
      text-align: center;
      line-height: 1.35;
      margin-bottom: 16px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .tv-hero-meta {
      display: flex; flex-direction: column; gap: 8px; align-items: center; margin-bottom: 16px;
    }
    .tv-hero-meta-item { font-size: clamp(15px, 1.1vw, 18px); color: #475569; display: flex; align-items: center; gap: 8px; }

    .tv-hero-countdown {
      font-size: clamp(16px, 1.2vw, 20px);
      font-weight: 800; text-align: center; text-transform: uppercase;
      padding: 8px 16px; border-radius: 10px; margin-top: auto;
    }
    .tv-hero-countdown.ongoing { color: #0F766E; background: rgba(15, 118, 110, 0.08); }
    .tv-hero-countdown.near { color: #B45309; background: rgba(180, 83, 9, 0.08); }

    .tv-tomorrow-section { flex: 0.8; display: flex; flex-direction: column; overflow: hidden; }
    .tv-tomorrow-list { display: flex; flex-direction: column; gap: 10px; flex: 1; overflow: hidden; }
    .tv-tomorrow-item {
      display: flex; align-items: center; padding: 12px 18px;
      background: #FFFFFF; border-radius: 14px; border: 1px solid rgba(0,0,0,0.03);
    }
    .tv-tomorrow-time { flex: 0 0 65px; font-size: clamp(16px, 1.2vw, 20px); font-weight: 800; color: #0B1F3A; }
    .tv-tomorrow-title { flex: 1; font-size: clamp(15px, 1.1vw, 18px); font-weight: 700; color: #334155; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 12px; }

    .tv-footer {
      height: 6vh; display: flex; justify-content: space-between; align-items: center;
      border-top: 2px solid rgba(11, 31, 58, 0.08); padding-top: 10px;
    }
    .tv-footer-left { font-size: clamp(16px, 1.2vw, 20px); color: #334155; font-weight: 600; display: flex; align-items: center; gap: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tv-footer-tag { color: #0B1F3A; font-weight: 900; }
    .tv-footer-right { font-size: clamp(15px, 1.1vw, 18px); font-weight: 700; color: #0F766E; }
    .tv-footer-right.offline { color: #B91C1C; }

    .btn-tv-fullscreen {
      position: fixed; top: 24px; right: 24px;
      background: rgba(11, 31, 58, 0.85); color: white; border: none;
      width: 50px; height: 50px; border-radius: 50%; display: flex;
      align-items: center; justify-content: center; font-size: 20px;
      cursor: pointer; z-index: 10000; opacity: 0.3; transition: opacity 0.3s;
    }
    .btn-tv-fullscreen:hover { opacity: 1; background: #0B1F3A; }
  </style>
</head>
<body>
  <div id="tv-mode-container">
    <button id="btn-tv-fullscreen" class="btn-tv-fullscreen" title="Toàn màn hình">
      <i class="fa-solid fa-expand"></i>
    </button>
    
    <header class="tv-header">
      <div class="tv-brand">
        <h2>ỦY BAN NHÂN DÂN XÃ NGHĨA LÂM</h2>
        <span class="tv-subbrand">LỊCH CÔNG TÁC</span>
      </div>
      
      <div class="tv-clock-area">
        <div id="tv-date">THỨ ---, 00/00/0000</div>
        <div id="tv-time">00:00</div>
      </div>
    </header>

    <div class="tv-body-lr">
      <div class="tv-left-today">
        <div class="tv-section-title">LỊCH CÔNG TÁC HÔM NAY</div>
        <div id="tv-events-list" class="tv-today-timeline"></div>
      </div>
      
      <div class="tv-right-upcoming">
        <div class="tv-next-hero-card" id="tv-next-hero"></div>
        <div class="tv-tomorrow-section">
          <div class="tv-section-title-small">NGÀY MAI</div>
          <div id="tv-tomorrow-list" class="tv-tomorrow-list"></div>
        </div>
      </div>
    </div>

    <footer class="tv-footer">
      <div class="tv-footer-left">
        <span class="tv-footer-tag">TRỌNG TÂM:</span>
        <span id="tv-focus-content">Hồ sơ đất đai • Thu ngân sách • Giải phóng mặt bằng (GPMB)</span>
      </div>
      <div class="tv-footer-right" id="tv-sync-status">
        <i class="fa-solid fa-spinner fa-spin"></i> Đang kết nối đồng bộ...
      </div>
    </footer>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      const dayNames = ['CHỦ NHẬT', 'THỨ HAI', 'THỨ BA', 'THỨ TƯ', 'THỨ NĂM', 'THỨ SÁU', 'THỨ BẢY'];
      const dayName = dayNames[now.getDay()];
      const date = String(now.getDate()).padStart(2, '0');
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const year = now.getFullYear();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');

      document.getElementById('tv-time').textContent = `${hours}:${minutes}`;
      document.getElementById('tv-date').textContent = `${dayName}, ${date}/${month}/${year}`;
    }
    updateClock();
    setInterval(updateClock, 1000);

    function formatDateISO(d) {
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function getWeekRange() {
      const d = new Date();
      const day = d.getDay();
      const diffToMonday = d.getDate() - day + (day === 0 ? -6 : 1);
      const monday = new Date(d.setDate(diffToMonday));
      const sunday = new Date(monday.getTime() + 6 * 24 * 60 * 60 * 1000);
      return { monday, sunday };
    }

    async function loadTVData() {
      const syncStatusEl = document.getElementById('tv-sync-status');
      const today = new Date();
      const todayStr = formatDateISO(today);
      const { monday, sunday } = getWeekRange();
      
      let weekEvents = [];
      let syncSuccess = false;

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 3000);

      try {
        const res = await fetch(`/api/events?startDate=${formatDateISO(monday)}&endDate=${formatDateISO(sunday)}`, { signal: controller.signal });
        clearTimeout(timeoutId);
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data)) {
            weekEvents = data;
            syncSuccess = true;
          }
        }
      } catch (e) {
        clearTimeout(timeoutId);
      }

      if (!Array.isArray(weekEvents) || weekEvents.length === 0) {
        const localData = JSON.parse(localStorage.getItem('ubnd_calendar_events') || '[]');
        weekEvents = localData;
        syncSuccess = true;
      }

      weekEvents = weekEvents.filter(evt => evt && typeof evt.start_time === 'string');
      weekEvents.sort((a, b) => a.start_time.localeCompare(b.start_time));

      if (syncStatusEl) {
        if (syncSuccess) {
          const now = new Date();
          syncStatusEl.innerHTML = `<i class="fa-solid fa-check"></i> Đồng bộ lúc ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
          syncStatusEl.className = 'tv-footer-right';
        } else {
          syncStatusEl.innerHTML = `⚠ Mất kết nối`;
          syncStatusEl.className = 'tv-footer-right offline';
        }
      }

      const todayEvents = weekEvents.filter(evt => evt.start_time.split(' ')[0] === todayStr);
      const remainingEvents = weekEvents.filter(evt => evt.start_time.split(' ')[0] > todayStr);

      renderTVGrid(todayEvents);
      renderTVUpcomingGrid(remainingEvents, todayEvents);
    }

    function renderTVGrid(todayEvents) {
      const container = document.getElementById('tv-events-list');
      container.innerHTML = '';

      if (todayEvents.length === 0) {
        container.innerHTML = `
          <div style="height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #FFFFFF; border-radius: 18px; border: 1px dashed rgba(11,31,58,0.15); width: 100%;">
            <i class="fa-solid fa-calendar-xmark" style="font-size: 3.5rem; color: #64748B; margin-bottom: 16px;"></i>
            <h4 style="font-size: 24px; font-weight: 800; color: #0B1F3A; margin-bottom: 8px;">Không có lịch công tác hôm nay</h4>
            <p style="font-size: 18px; color: #64748B;">Lịch làm việc sẽ được cập nhật tự động trực tuyến.</p>
          </div>
        `;
        return;
      }

      const now = new Date();
      todayEvents.forEach(evt => {
        const startTime = new Date(evt.start_time.replace(/-/g, '/'));
        const endTime = new Date(evt.end_time.replace(/-/g, '/'));
        if (now > endTime) evt.tvStatus = 'completed';
        else if (now >= startTime && now <= endTime) evt.tvStatus = 'ongoing';
        else {
          evt.tvStatus = 'upcoming';
          const diffMins = Math.floor((startTime - now) / 60000);
          evt.diffMins = diffMins;
          if (diffMins <= 30 && diffMins > 0) evt.tvStatus = 'upcoming-near';
        }
      });

      let focusIndex = todayEvents.findIndex(evt => evt.tvStatus === 'ongoing' || evt.tvStatus === 'upcoming' || evt.tvStatus === 'upcoming-near');
      if (focusIndex === -1) focusIndex = todayEvents.length - 1;

      const startIndex = Math.max(0, focusIndex - 2);
      const slicedEvents = todayEvents.slice(startIndex, startIndex + 6);

      slicedEvents.forEach(evt => {
        const card = document.createElement('div');
        card.className = `tv-timeline-item ${evt.tvStatus}`;
        const startTimeStr = evt.start_time.split(' ')[1];
        
        let statusHtml = '';
        if (evt.tvStatus === 'completed') statusHtml = `<span class="tv-badge completed"><i class="fa-solid fa-check"></i> Đã kết thúc</span>`;
        else if (evt.tvStatus === 'ongoing') statusHtml = `<span class="tv-badge ongoing"><i class="fa-solid fa-circle"></i> Đang diễn ra</span>`;
        else if (evt.tvStatus === 'upcoming-near') statusHtml = `<span class="tv-badge upcoming-near"><i class="fa-solid fa-clock"></i> Còn ${evt.diffMins} phút</span>`;

        const qrHtml = evt.document_link ? `<div class="tv-item-qr-small"><img src="https://api.qrserver.com/v1/create-qr-code/?size=60x60&data=${encodeURIComponent(evt.document_link)}&color=0b1f3a" alt="QR"></div>` : '';

        let metaHtml = '';
        if (evt.chairperson) metaHtml += `<div class="tv-item-meta"><i class="fa-solid fa-user-tie"></i><span>Chủ trì: <strong>${evt.chairperson.split(' - ')[1] || evt.chairperson}</strong></span></div>`;
        if (evt.location) metaHtml += `<div class="tv-item-meta"><i class="fa-solid fa-location-dot"></i><span>Địa điểm: <strong>${evt.location}</strong></span></div>`;

        card.innerHTML = `
          <div class="tv-item-time">${startTimeStr}</div>
          <div class="tv-item-body">
            <div class="tv-item-title">${evt.title}</div>
            <div class="tv-item-desc">${metaHtml}</div>
          </div>
          <div class="tv-item-status">${statusHtml}${qrHtml}</div>
        `;
        container.appendChild(card);
      });
    }

    function renderTVUpcomingGrid(remainingEvents, todayEvents) {
      const now = new Date();
      const heroContainer = document.getElementById('tv-next-hero');
      if (heroContainer) {
        heroContainer.innerHTML = '';
        const heroEvent = todayEvents.find(evt => evt.tvStatus === 'ongoing' || evt.tvStatus === 'upcoming' || evt.tvStatus === 'upcoming-near');
        if (heroEvent) {
          const startTimeStr = heroEvent.start_time.split(' ')[1];
          let countdownHtml = '';
          if (heroEvent.tvStatus === 'ongoing') countdownHtml = `<div class="tv-hero-countdown ongoing"><i class="fa-solid fa-circle"></i> ĐANG DIỄN RA</div>`;
          else if (heroEvent.tvStatus === 'upcoming-near') countdownHtml = `<div class="tv-hero-countdown near"><i class="fa-solid fa-clock"></i> Còn ${heroEvent.diffMins} phút</div>`;
          else {
            const diffMs = new Date(heroEvent.start_time.replace(/-/g, '/')) - now;
            const diffHours = Math.floor(diffMs / 3600000);
            const diffMins = Math.floor((diffMs % 3600000) / 60000);
            countdownHtml = `<div class="tv-hero-countdown"><i class="fa-solid fa-clock"></i> ${diffHours > 0 ? `Còn ${diffHours}h ${diffMins}m` : `Còn ${diffMins}m`}</div>`;
          }
          const cleanChair = heroEvent.chairperson ? heroEvent.chairperson.split(' - ')[1] || heroEvent.chairperson : '';

          heroContainer.innerHTML = `
            <div class="tv-hero-label">${heroEvent.tvStatus === 'ongoing' ? 'ĐANG DIỄN RA' : 'TIẾP THEO'}</div>
            <div class="tv-hero-time">${startTimeStr}</div>
            <div class="tv-hero-title">${heroEvent.title}</div>
            <div class="tv-hero-meta">
              <div class="tv-hero-meta-item"><i class="fa-solid fa-location-dot"></i><span>${heroEvent.location || 'Phòng họp UBND'}</span></div>
              ${cleanChair ? `<div class="tv-hero-meta-item"><i class="fa-solid fa-user-tie"></i><span>Chủ trì: ${cleanChair}</span></div>` : ''}
            </div>
            ${countdownHtml}
          `;
        } else {
          heroContainer.innerHTML = `
            <div class="tv-hero-label">HÔM NAY</div>
            <div class="tv-hero-time" style="color: #0F766E;"><i class="fa-solid fa-circle-check"></i></div>
            <div class="tv-hero-title" style="color: #0F766E; font-size: 22px;">ĐÃ HOÀN THÀNH</div>
            <div class="tv-hero-meta"><div class="tv-hero-meta-item"><span>LỊCH CÔNG TÁC HÔM NAY</span></div></div>
          `;
        }
      }

      const tomorrowContainer = document.getElementById('tv-tomorrow-list');
      if (tomorrowContainer) {
        tomorrowContainer.innerHTML = '';
        const tomorrow = new Date(now.getTime() + 24 * 60 * 60 * 1000);
        const tomorrowStr = formatDateISO(tomorrow);
        const tomorrowEvents = remainingEvents.filter(evt => evt.start_time.split(' ')[0] === tomorrowStr);

        if (tomorrowEvents.length === 0) {
          tomorrowContainer.innerHTML = `<div style="font-size: 16px; color: #64748B; text-align: center; padding: 16px; border: 1px dashed rgba(0,0,0,0.06); border-radius: 12px; background: white;">Không có lịch công tác ngày mai</div>`;
        } else {
          tomorrowEvents.sort((a, b) => a.start_time.localeCompare(b.start_time));
          tomorrowEvents.slice(0, 3).forEach(evt => {
            const item = document.createElement('div');
            item.className = 'tv-tomorrow-item';
            item.innerHTML = `<div class="tv-tomorrow-time">${evt.start_time.split(' ')[1]}</div><div class="tv-tomorrow-title">${evt.title}</div>`;
            tomorrowContainer.appendChild(item);
          });
        }
      }
    }

    loadTVData();
    setInterval(loadTVData, 30000);

    document.getElementById('btn-tv-fullscreen').addEventListener('click', () => {
      const container = document.getElementById('tv-mode-container');
      if (!document.fullscreenElement) container.requestFullscreen().catch(e => {});
      else document.exitFullscreen();
    });
  </script>
</body>
</html>
